name: demos
on: [push, pull_request]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python3 run_v0_engine.py
      - run: python3 run_v1_product_ops.py
      - run: python3 run_v2_agent.py
      - run: python3 -m unittest tests/smoke_test.py -v
