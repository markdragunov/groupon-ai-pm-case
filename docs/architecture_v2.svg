<svg viewBox="0 0 980 695" width="980" height="695" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#018A22"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="695" fill="#ffffff"/>

  <!-- ======================= AGENT LOOP PILLS ======================= -->
  <path d="M 869 28 C 869 8, 105 8, 105 28" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrg)"/>
  <text x="487" y="16" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">the unit of work is the loop — until a termination rule fires</text>

  <g font-size="12" font-weight="bold" text-anchor="middle">
    <rect x="25" y="28" width="160" height="26" rx="13" fill="#f0f7f1" stroke="#018A22"/>
    <text x="105" y="45" fill="#036b1e">Decide</text>
    <rect x="216" y="28" width="160" height="26" rx="13" fill="#f0f7f1" stroke="#018A22"/>
    <text x="296" y="45" fill="#036b1e">Verify</text>
    <rect x="407" y="28" width="160" height="26" rx="13" fill="#f0f7f1" stroke="#018A22"/>
    <text x="487" y="45" fill="#036b1e">Act</text>
    <rect x="598" y="28" width="160" height="26" rx="13" fill="#f0f7f1" stroke="#018A22"/>
    <text x="678" y="45" fill="#036b1e">Observe</text>
    <rect x="789" y="28" width="160" height="26" rx="13" fill="#f0f7f1" stroke="#018A22"/>
    <text x="869" y="45" fill="#036b1e">Remember</text>
  </g>
  <g stroke="#018A22" stroke-width="1.6">
    <line x1="187" y1="41" x2="213" y2="41" marker-end="url(#arr)"/>
    <line x1="378" y1="41" x2="404" y2="41" marker-end="url(#arr)"/>
    <line x1="569" y1="41" x2="595" y2="41" marker-end="url(#arr)"/>
    <line x1="760" y1="41" x2="786" y2="41" marker-end="url(#arr)"/>
  </g>

  <!-- memory -> brain feedback arc -->
  <path d="M 665 86 C 665 72, 130 72, 130 86" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrg)"/>
  <text x="400" y="80" font-size="9.5" fill="#6b7280" text-anchor="middle">the brain sees only the compacted summary</text>

  <!-- ======================= BRAIN ======================= -->
  <rect x="15" y="90" width="235" height="160" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="27" y="110" font-size="12.5" font-weight="bold" fill="#018A22">DECIDE — pluggable brain</text>
  <g font-size="10.5" fill="#1f2937">
    <text x="27" y="130" font-weight="bold">HeuristicBrain</text>
    <text x="27" y="144">default policy; eager by design —</text>
    <text x="27" y="158">the verifier is the adult in the room</text>
    <text x="27" y="178" font-weight="bold">ClaudeBrain (optional, LLM)</text>
    <text x="27" y="192">strict JSON in/out; validated against</text>
    <text x="27" y="206">the same action space; any error →</text>
    <text x="27" y="220">heuristic fallback, journaled</text>
    <text x="27" y="239" fill="#036b1e" font-style="italic">an LLM gets zero extra authority</text>
  </g>

  <!-- ======================= ACTION SPACE ======================= -->
  <rect x="15" y="262" width="235" height="88" rx="8" fill="#f4faf5" stroke="#018A22"/>
  <text x="27" y="281" font-size="11.5" font-weight="bold" fill="#036b1e">AGENT ACTION SPACE — bounded</text>
  <g font-size="10.5" fill="#1f2937">
    <text x="27" y="299">instrument · start_shadow · ramp{share}</text>
    <text x="27" y="313">freeze · escalate_human · resume</text>
    <text x="27" y="327">final_report · wait</text>
    <text x="27" y="343" fill="#6b7280" font-style="italic">nothing else exists to the brain</text>
  </g>

  <!-- ======================= VERIFIER ======================= -->
  <rect x="270" y="90" width="280" height="260" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.3"/>
  <text x="282" y="110" font-size="12.5" font-weight="bold" fill="#111827">VERIFY — not optional</text>
  <g font-size="10.5" fill="#1f2937">
    <text x="282" y="130" font-weight="bold">Preconditions — evidence gates:</text>
    <text x="282" y="146">· shadow ≥ 2w before the first live step</text>
    <text x="282" y="160">· first step = 10%, no skipping</text>
    <text x="282" y="174">· hold ≥ 2w per ramp step</text>
    <text x="282" y="188">· cumulative lift &gt; 0, guardrails clean</text>
    <text x="282" y="202">· resume: human approval required</text>
    <text x="282" y="222" font-weight="bold">Spin detector:</text>
    <text x="282" y="237">same action + same reason ×2 →</text>
    <text x="282" y="251">escalate ("retrying isn't learning")</text>
  </g>
  <rect x="282" y="263" width="256" height="74" rx="6" fill="#fdf3f1" stroke="#dba79c"/>
  <text x="292" y="281" font-size="11" font-weight="bold" fill="#9a3412">SAFETY OVERRIDE — post-week</text>
  <g font-size="10.5" fill="#7c2d12">
    <text x="292" y="297">fraud ≥ 18 bps AND ≥ 3 events →</text>
    <text x="292" y="311">forced freeze + escalation —</text>
    <text x="292" y="325" font-weight="bold">the brain is not consulted</text>
  </g>

  <!-- ======================= MEMORY ======================= -->
  <rect x="570" y="90" width="190" height="160" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="582" y="110" font-size="12.5" font-weight="bold" fill="#018A22">REMEMBER</text>
  <g font-size="10.5" fill="#1f2937">
    <text x="582" y="130" font-weight="bold">journal — append-only</text>
    <text x="582" y="144">every decision, rejection,</text>
    <text x="582" y="158">override, approval (audit)</text>
    <text x="582" y="178" font-weight="bold">summary — compacted</text>
    <text x="582" y="192">bounded state the brain</text>
    <text x="582" y="206">reasons over; no raw-</text>
    <text x="582" y="220">history re-reads</text>
    <text x="582" y="239" fill="#6b7280" font-style="italic">context stays bounded</text>
  </g>

  <!-- ======================= TERMINATION ======================= -->
  <rect x="775" y="90" width="190" height="160" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="787" y="110" font-size="12.5" font-weight="bold" fill="#018A22">TERMINATE — explicit</text>
  <g font-size="10.5" fill="#1f2937">
    <text x="787" y="130">· goal: final report with</text>
    <text x="787" y="144">  live evidence</text>
    <text x="787" y="162">· budget: 14 weeks max</text>
    <text x="787" y="180">· escalation SLA: hand off,</text>
    <text x="787" y="194">  never wait forever</text>
    <text x="787" y="216" font-weight="bold">stops are never silent —</text>
    <text x="787" y="230">a handoff report always ships</text>
  </g>

  <!-- ======================= HUMAN-IN-THE-LOOP ======================= -->
  <rect x="570" y="262" width="395" height="88" rx="8" fill="#fffbeb" stroke="#d4b106"/>
  <text x="582" y="281" font-size="11.5" font-weight="bold" fill="#854d0e">HUMAN-IN-THE-LOOP — a first-class node</text>
  <g font-size="10.5" fill="#713f12">
    <text x="582" y="299">escalation → review (2w latency, simulated) → approval inbox</text>
    <text x="582" y="313">the agent cannot approve its own resume — verifier-enforced;</text>
    <text x="582" y="327">resume only at reduced share, after fraud normalizes</text>
  </g>
  <line x1="550" y1="300" x2="567" y2="300" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrr)"/>

  <!-- flow arrows agent <-> world -->
  <line x1="350" y1="352" x2="350" y2="380" stroke="#018A22" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="342" y="369" font-size="9.5" fill="#036b1e" text-anchor="end">ACT: set serving mode</text>
  <line x1="470" y1="380" x2="470" y2="354" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrr)"/>
  <text x="478" y="369" font-size="9.5" fill="#b91c1c">fraud report → override</text>
  <path d="M 560 380 L 560 140 L 567 140" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrg)"/>
  <text x="620" y="257" font-size="9.5" fill="#4b5563">OBSERVE: weekly report</text>

  <!-- ======================= WORLD ======================= -->
  <rect x="15" y="382" width="950" height="212" rx="8" fill="#fafaf8" stroke="#9ca3af"/>
  <text x="27" y="403" font-size="12.5" font-weight="bold" fill="#111827">WORLD — the v0 engine, unchanged. The agent's ONLY control is the serving mode:</text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="27" y="412" width="150" height="24" rx="12" fill="#ffffff" stroke="#9ca3af"/>
    <text x="102" y="428" fill="#374151">baseline (rules 100%)</text>
    <rect x="187" y="412" width="215" height="24" rx="12" fill="#ffffff" stroke="#9ca3af"/>
    <text x="294" y="428" fill="#374151">shadow + 5% budgeted exploration</text>
    <rect x="412" y="412" width="180" height="24" rx="12" fill="#ffffff" stroke="#9ca3af"/>
    <text x="502" y="428" fill="#374151">live @ 10% → 25% → …</text>
    <rect x="602" y="412" width="150" height="24" rx="12" fill="#ffffff" stroke="#9ca3af"/>
    <text x="677" y="428" fill="#374151">frozen → rules</text>
  </g>
  <text x="770" y="428" font-size="10" fill="#6b7280" font-style="italic">mode ≠ safety: rules are untouchable</text>

  <rect x="27" y="446" width="926" height="98" rx="8" fill="#f4faf5" stroke="#374151" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="39" y="465" font-size="11.5" font-weight="bold" fill="#111827">deterministic cage — unchanged from v0 (SAFETY_RULES state machine)</text>
  <g font-size="10.5" fill="#374151">
    <text x="39" y="484">RULES_BASELINE — serves by default; the fallback every kill reverts to</text>
    <text x="39" y="500">BANDIT RANKER — evidence gate (≥12 labels AND +4 pts over rules), exploration ≤ 5% enforced by counter</text>
    <text x="39" y="516">payment execution deterministic forever: bounded action space · idempotency · money-state from the ledger ·</text>
    <text x="39" y="530">no re-charge · do-not-retry list · timeout ⇒ no retry</text>
  </g>
  <g font-size="10.5">
    <text x="27" y="565" fill="#9a3412" font-weight="bold">reality injected:</text>
    <text x="122" y="565" fill="#7c2d12">fraud-spike weeks — the loop is graded on adverse feedback, not the happy path</text>
    <text x="27" y="583" fill="#374151" font-weight="bold">weekly report:</text>
    <text x="115" y="583" fill="#4b5563">recovery rates engine vs rules · fraud bps (events / n) · gate contexts · labels accumulated</text>
  </g>

  <!-- ======================= SAMPLE RUN ======================= -->
  <text x="27" y="622" font-size="10.5" fill="#111827" font-weight="bold">one seeded run:</text>
  <text x="122" y="622" font-size="10.5" fill="#374151">W4 ramp 10% ✓ · W5 ramp 25% ✗ (hold 2w) · W6 ramp 25% ✓ (lift +2.9) · W7 KILL ⚠ 152 bps · W9 ✉ approval · W10 resume 10% · W12 SHIP (gated contexts)</text>

  <!-- footer principle -->
  <text x="490" y="655" font-size="12" fill="#111827" text-anchor="middle" font-style="italic" font-weight="bold">The agent replaces the operator of the loop, not the engine — same cage, one level up.</text>
  <text x="490" y="674" font-size="10.5" fill="#4b5563" text-anchor="middle" font-style="italic">Context → memory.py · Termination → goal / budget / SLA · Verification → verifier.py — the three hard problems, addressed by name.</text>
</svg>
