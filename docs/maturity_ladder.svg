<svg viewBox="0 0 980 240" width="980" height="240" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="240" fill="#ffffff"/>
  <defs>
    <marker id="la" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#018A22"/>
    </marker>
  </defs>

  <!-- v0 -->
  <rect x="20" y="120" width="215" height="70" rx="8" fill="#f0f7f1" stroke="#018A22" stroke-width="1.4"/>
  <text x="34" y="143" font-size="13" font-weight="bold" fill="#036b1e">v0 · ENGINE</text>
  <text x="34" y="161" font-size="10.5" fill="#374151">decides: the recovery action</text>
  <text x="34" y="176" font-size="10.5" fill="#6b7280">horizon: seconds</text>

  <!-- v1 -->
  <rect x="265" y="85" width="215" height="70" rx="8" fill="#f0f7f1" stroke="#018A22" stroke-width="1.4"/>
  <text x="279" y="108" font-size="13" font-weight="bold" fill="#036b1e">v1 · PRODUCT OPS</text>
  <text x="279" y="126" font-size="10.5" fill="#374151">decides: what to measure &amp; test</text>
  <text x="279" y="141" font-size="10.5" fill="#6b7280">horizon: weeks</text>

  <!-- v2 -->
  <rect x="510" y="50" width="215" height="70" rx="8" fill="#f0f7f1" stroke="#018A22" stroke-width="1.4"/>
  <text x="524" y="73" font-size="13" font-weight="bold" fill="#036b1e">v2 · AGENT</text>
  <text x="524" y="91" font-size="10.5" fill="#374151">decides: when to ramp / freeze</text>
  <text x="524" y="106" font-size="10.5" fill="#6b7280">horizon: quarters</text>

  <!-- v3 dashed -->
  <rect x="755" y="15" width="205" height="70" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="769" y="38" font-size="13" font-weight="bold" fill="#6b7280">v3 · PLATFORM</text>
  <text x="769" y="56" font-size="10.5" fill="#6b7280">multi-funnel, real approvals</text>
  <text x="769" y="71" font-size="10.5" fill="#9ca3af" font-style="italic">deliberately not built</text>

  <!-- arrows -->
  <line x1="237" y1="140" x2="262" y2="125" stroke="#018A22" stroke-width="1.8" marker-end="url(#la)"/>
  <line x1="482" y1="105" x2="507" y2="90" stroke="#018A22" stroke-width="1.8" marker-end="url(#la)"/>
  <line x1="727" y1="70" x2="752" y2="55" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#la)"/>

  <!-- limitation captions under arrows -->
  <text x="250" y="170" font-size="9.5" fill="#6b7280" font-style="italic">"a human still runs the rollout"</text>
  <text x="495" y="135" font-size="9.5" fill="#6b7280" font-style="italic">"checkpoints still run by hand"</text>
  <text x="742" y="100" font-size="9.5" fill="#9ca3af" font-style="italic">"one funnel is not a platform"</text>

  <!-- invariant strip -->
  <rect x="20" y="205" width="940" height="26" rx="13" fill="#f4faf5" stroke="#018A22" stroke-dasharray="6 4"/>
  <text x="490" y="222" font-size="11" fill="#036b1e" text-anchor="middle" font-weight="bold">invariant at every level: deterministic execution · bounded action spaces · evidence gates · a human owns irreversible risk</text>
</svg>
